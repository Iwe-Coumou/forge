name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            goos=${target%/*}
            goarch=${target#*/}
            binary=forge
            [ "$goos" = "windows" ] && binary=forge.exe

            echo "building $goos/$goarch"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/Iwe-Coumou/forge/cmd.version=${GITHUB_REF_NAME}" \
              -o "$binary" .

            archive="dist/forge_${GITHUB_REF_NAME}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              zip -j "${archive}.zip" "$binary" README.md LICENSE
            else
              tar -czf "${archive}.tar.gz" "$binary" README.md LICENSE
            fi
            rm -f "$binary"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
